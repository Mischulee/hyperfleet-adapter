schema_version: "2.0"

params:
  - name: clusterId
    source: event.id
    type: string
    required: true
  - name: clusterStatus
    source:
      api_call:
        method: GET
        url: /clusters/{{ .clusterId }}
        timeout: 10s
  - name: generation
    source: clusterStatus.generation
  - name: is_deleting
    source:
      expression: "clusterStatus.?deleted_time.hasValue()"

resources:
  - name: configMap
    transport: remote-primary
    manifest:
      ref: configmap.yaml
    discovery:
      namespace: default
      by_name: "{{ .clusterId }}-config"
    lifecycle:
      delete:
        when:
          expression: "is_deleting"

post:
  payloads:
    - name: clusterStatusPayload
      build:
        adapter: "{{ .adapter.name }}"
        # Remote reads are tri-state. An unsynced or stale mirror is Unknown, not
        # False: only a confirmed absence or a bad current status is False.
        conditions:
          - type: Applied
            status:
              expression: |
                resource_states.?configMap.orValue("") == "present" ? "True"
                  : resource_states.?configMap.orValue("") == "confirmed_deleted" ? "False"
                  : "Unknown"
            reason:
              expression: |
                resource_states.?configMap.orValue("") == "present" ? "ConfigMapObserved"
                  : resource_states.?configMap.orValue("") == "confirmed_deleted" ? "ConfigMapNotFound"
                  : "MirrorNotSynced"
            message:
              expression: |
                resource_states.?configMap.orValue("") == "present"
                  ? "ConfigMap read from the target cluster"
                  : resource_states.?configMap.orValue("") == "confirmed_deleted"
                    ? "ConfigMap is confirmed absent from the target cluster"
                    : "Waiting for the target cluster mirror to sync"
          - type: Available
            status:
              expression: |
                resource_states.?configMap.orValue("") == "confirmed_deleted" ? "False"
                  : resource_states.?configMap.orValue("") == "present"
                      && "hyperfleet.io/generation" in resources.configMap.?metadata.?annotations.orValue({})
                      && resources.configMap.metadata.annotations["hyperfleet.io/generation"] == string(generation)
                    ? "True" : "Unknown"
            reason:
              expression: |
                resource_states.?configMap.orValue("") == "confirmed_deleted" ? "ConfigMapNotFound"
                  : resource_states.?configMap.orValue("") == "present"
                      && "hyperfleet.io/generation" in resources.configMap.?metadata.?annotations.orValue({})
                      && resources.configMap.metadata.annotations["hyperfleet.io/generation"] == string(generation)
                    ? "GenerationObserved" : "GenerationPending"
            message:
              expression: |
                resource_states.?configMap.orValue("") == "confirmed_deleted"
                  ? "ConfigMap is confirmed absent from the target cluster"
                  : resource_states.?configMap.orValue("") == "present"
                      && "hyperfleet.io/generation" in resources.configMap.?metadata.?annotations.orValue({})
                      && resources.configMap.metadata.annotations["hyperfleet.io/generation"] == string(generation)
                    ? "ConfigMap generation matches the requested generation"
                    : "Waiting for the mirror to report the requested generation"
          - type: Health
            status:
              expression: |
                adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                  ? "True" : "False"
            reason:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                  ? "ExecutionFailed:" + adapter.?executionError.?phase.orValue("unknown")
                  : adapter.?resourcesSkipped.orValue(false) ? "ResourcesSkipped" : "Healthy"
            message:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                  ? "Adapter failed at phase ["
                      + adapter.?executionError.?phase.orValue("unknown")
                      + "] step ["
                      + adapter.?executionError.?step.orValue("unknown")
                      + "]: "
                      + adapter.?executionError.?message.orValue(adapter.?errorMessage.orValue("no details"))
                  : adapter.?resourcesSkipped.orValue(false)
                    ? "Resources skipped: " + adapter.?skipReason.orValue("unknown reason")
                    : "Adapter execution completed successfully"
          - type: Finalized
            status:
              expression: |
                is_deleting
                  && adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                  && resource_states.?configMap.orValue("") == "confirmed_deleted"
                  ? "True" : "False"
            reason:
              expression: |
                !is_deleting ? ""
                  : adapter.?executionStatus.orValue("") != "success" ? "AdapterUnhealthy"
                  : resource_states.?configMap.orValue("") == "confirmed_deleted" ? "CleanupConfirmed"
                  : "CleanupInProgress"
            message:
              expression: |
                !is_deleting ? ""
                  : adapter.?executionStatus.orValue("") != "success"
                    ? "Cannot confirm cleanup while the adapter is unhealthy"
                    : resource_states.?configMap.orValue("") == "confirmed_deleted"
                      ? "ConfigMap deletion confirmed"
                      : "Waiting for confirmed ConfigMap deletion"
        observed_generation:
          expression: generation
        observed_time: '{{ now | date "2006-01-02T15:04:05Z07:00" }}'
  post_actions:
    - name: reportClusterStatus
      api_call:
        method: PUT
        url: /clusters/{{ .clusterId }}/statuses
        headers:
          - name: Content-Type
            value: application/json
        body: "{{ .clusterStatusPayload }}"
