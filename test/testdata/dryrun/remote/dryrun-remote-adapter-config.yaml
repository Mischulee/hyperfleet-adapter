# Adapter deployment configuration for a named remote transport dry run.
adapter:
  name: dryrun-remote-adapter
  version: "0.3.0"

clients:
  hyperfleet_api:
    base_url: http://hyperfleet-api:8000
    version: v1
    timeout: 10s
    retry_attempts: 3
    retry_backoff: exponential
  broker:
    subscription_id: "dryrun-sub"
    topic: "cluster-events"
  kubernetes:
    api_version: "v1"

stores:
  remote-memory:
    type: memory

transports:
  remote-primary:
    type: remote
    store: remote-memory
    target_cluster: "{{ .clusterId }}"
    resource_plurals:
      "v1/ConfigMap": configmaps
