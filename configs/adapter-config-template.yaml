# Deployment config for a v2 task. Replace the API and broker endpoints.
adapter:
  name: example-adapter
  version: "0.3.0"
log:
  level: info
clients:
  hyperfleet_api:
    base_url: http://hyperfleet-api:8000
    version: v1
    timeout: 10s
  broker:
    subscription_id: CHANGE_ME
    topic: CHANGE_ME
  kubernetes:
    api_version: v1

# The local-only task in adapter-task-config-template.yaml needs no store or
# named transport. For a remote task, add a shared store and named route as in
# charts/examples/remote-two-resources/adapter-config.yaml.
