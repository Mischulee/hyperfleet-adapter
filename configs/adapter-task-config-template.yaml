# V2 task config. A resource with no transport uses local Kubernetes.
schema_version: "2.0"
params:
  - name: clusterId
    source: event.id
    type: string
    required: true
  - name: clusterStatus
    source:
      api_call:
        method: GET
        url: /clusters/{{ .clusterId }}
        timeout: 10s
  - name: generation
    source: clusterStatus.generation
    type: int
  - name: is_deleting
    source:
      expression: "clusterStatus.?deleted_time.hasValue()"

resources:
  - name: namespace
    manifest:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ .clusterId }}"
        annotations:
          hyperfleet.io/generation: "{{ .generation }}"
    discovery:
      by_name: "{{ .clusterId }}"
    lifecycle:
      delete:
        when:
          expression: "is_deleting"

post:
  payloads:
    - name: clusterStatusPayload
      build:
        adapter: "{{ .adapter.name }}"
        conditions:
          - type: Applied
            status:
              expression: 'resource_states.?namespace.orValue("") == "present" ? "True" : "False"'
            reason:
              expression: 'resource_states.?namespace.orValue("") == "present" ? "NamespaceApplied" : "NamespacePending"'
            message:
              expression: |
                resource_states.?namespace.orValue("") == "present"
                  ? "Namespace applied" : "Namespace not applied yet"
          - type: Available
            status:
              expression: 'resources.?namespace.?status.?phase.orValue("") == "Active" ? "True" : "False"'
            reason:
              expression: 'resources.?namespace.?status.?phase.orValue("") == "Active" ? "NamespaceActive" : "NamespaceNotActive"'
            message:
              expression: |
                "Namespace phase: " + resources.?namespace.?status.?phase.orValue("unknown")
          - type: Health
            status:
              expression: |
                adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                  ? "True" : "False"
            reason:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                  ? "ExecutionFailed:" + adapter.?executionError.?phase.orValue("unknown")
                  : adapter.?resourcesSkipped.orValue(false) ? "ResourcesSkipped" : "Healthy"
            message:
              expression: |
                adapter.?executionStatus.orValue("") != "success"
                  ? "Adapter failed at phase ["
                      + adapter.?executionError.?phase.orValue("unknown")
                      + "] step ["
                      + adapter.?executionError.?step.orValue("unknown")
                      + "]: "
                      + adapter.?executionError.?message.orValue(adapter.?errorMessage.orValue("no details"))
                  : adapter.?resourcesSkipped.orValue(false)
                    ? "Resources skipped: " + adapter.?skipReason.orValue("unknown reason")
                    : "Adapter execution completed successfully"
          - type: Finalized
            status:
              expression: |
                is_deleting
                  && adapter.?executionStatus.orValue("") == "success"
                  && !adapter.?resourcesSkipped.orValue(false)
                  && resource_states.?namespace.orValue("") == "confirmed_deleted"
                  ? "True" : "False"
            reason:
              expression: |
                !is_deleting ? ""
                  : adapter.?executionStatus.orValue("") != "success" ? "AdapterUnhealthy"
                  : resource_states.?namespace.orValue("") == "confirmed_deleted" ? "CleanupConfirmed"
                  : "CleanupInProgress"
            message:
              expression: |
                !is_deleting ? ""
                  : adapter.?executionStatus.orValue("") != "success"
                    ? "Cannot confirm cleanup while the adapter is unhealthy"
                    : resource_states.?namespace.orValue("") == "confirmed_deleted"
                      ? "Namespace deletion confirmed"
                      : "Waiting for confirmed Namespace deletion"
        observed_generation:
          expression: generation
        observed_time: '{{ now | date "2006-01-02T15:04:05Z07:00" }}'
  post_actions:
    - name: reportClusterStatus
      api_call:
        method: PUT
        url: /clusters/{{ .clusterId }}/statuses
        headers:
          - name: Content-Type
            value: application/json
        body: "{{ .clusterStatusPayload }}"
